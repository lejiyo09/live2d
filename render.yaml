# Render Blueprint: static site (New → Blueprint → select this repo).
services:
  - type: web
    name: rig-studio
    runtime: static
    branch: main
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile && npx -y pnpm@10.28.0 build
    staticPublishPath: ./apps/web/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Opens with the sample character when the browser has no saved project.
      - key: VITE_DEMO
        value: "1"
      # Neutral public name so the site is not mistaken for a Live2D Inc. product.
      - key: VITE_APP_NAME
        value: Rig Studio
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
